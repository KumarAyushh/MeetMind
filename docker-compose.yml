# Local infrastructure for development. Run with: pnpm db:up
# We only containerise the services our app depends on (Postgres + Redis);
# the api and web apps run directly on your machine for fast reloads.
services:
  postgres:
    # Official Postgres 16 image with the pgvector extension pre-installed,
    # which we need later for storing and searching transcript embeddings.
    image: pgvector/pgvector:pg16
    container_name: meetingmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to 127.0.0.1 so only this machine can reach the DB (not the LAN).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # keeps data between restarts
    healthcheck:
      # $$ escapes compose's own substitution, so the shell inside the
      # container reads POSTGRES_USER and the check always matches .env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    # Redis backs the BullMQ job queue (async AI extraction jobs).
    image: redis:7-alpine
    container_name: meetingmind-redis
    # Require a password even locally, so dev behaves like production Redis.
    # ":?" makes compose stop with an error if REDIS_PASSWORD is missing from
    # .env, instead of silently starting Redis with an empty password.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
